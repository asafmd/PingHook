<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — PingHook</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪝</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0f0a;
            --bg-card: #111811;
            --bg-input: #0f1a0f;
            --accent: #10b981;
            --accent-light: #34d399;
            --accent-glow: rgba(16,185,129,0.12);
            --border: #1f3d1f;
            --border-focus: rgba(16,185,129,0.5);
            --text: #f8fafc;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(16,185,129,0.12), transparent);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.15rem;
            text-decoration: none;
            color: var(--text);
            margin-bottom: 2rem;
            justify-content: center;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #22c55e);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem; }
        .subtitle { text-align: center; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem; }

        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #fca5a5;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .form-group { margin-bottom: 1rem; }

        label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.4rem; }

        .label-hint { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; margin-left: 0.5rem; }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus { border-color: var(--border-focus); }
        input::placeholder { color: var(--text-muted); }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(16,185,129,0.3);
        }

        .btn-primary:hover { background: var(--accent-light); }

        .btn-oauth {
            background: var(--bg-input);
            color: var(--text);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
        }

        .btn-oauth:hover { border-color: var(--accent); background: var(--accent-glow); }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .optional-section {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-top: 1rem;
            margin-bottom: 1.25rem;
        }

        .optional-toggle {
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .optional-toggle:hover { color: var(--text-secondary); }

        .optional-body { display: none; margin-top: 0.75rem; }
        .optional-body.open { display: block; }

        .footer-link {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 1.5rem;
        }

        .footer-link a { color: var(--accent-light); text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="logo">
            <div class="logo-icon">🪝</div>
            PingHook
        </a>

        <h1>Create your account</h1>
        <p class="subtitle">Set up your PingHook dashboard</p>

        {% if error %}
        <div class="error-box">{{ error.replace('+', ' ') }}</div>
        {% endif %}

        {% if google_enabled %}
        <a href="/auth/google" style="text-decoration:none;display:block;margin-bottom:0.6rem;">
            <button type="button" class="btn btn-oauth">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
        </a>
        {% endif %}

        {% if github_enabled %}
        <a href="/auth/github" style="text-decoration:none;display:block;">
            <button type="button" class="btn btn-oauth">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                Continue with GitHub
            </button>
        </a>
        {% endif %}

        <div class="divider">or register with email</div>

        <form method="POST" action="/auth/register">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>Password <span class="label-hint">min. 8 characters</span></label>
                <input type="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
            </div>

            <div class="optional-section">
                <div class="optional-toggle" onclick="toggleOptional(this)">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 1l1.5 3 3.5.5-2.5 2.5.5 3.5L6 9l-3 1.5.5-3.5L1 4.5 4.5 4z"/></svg>
                    Already use PingHook via Telegram or Slack?
                </div>
                <div class="optional-body" id="optBody">
                    <label style="margin-top:0.5rem;">Your existing API key <span class="label-hint">optional — links your bot account</span></label>
                    <input type="text" name="existing_key" placeholder="Paste API key from /pinghook mykey" autocomplete="off" spellcheck="false">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Create account &rarr;</button>
        </form>

        <p class="footer-link">
            Already have an account? <a href="/auth/login">Log in &rarr;</a>
        </p>
    </div>

    <script>
        function toggleOptional(el) {
            const body = document.getElementById('optBody');
            body.classList.toggle('open');
        }
    </script>
</body>
</html>
